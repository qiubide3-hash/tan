<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>课间游戏厅 · 硬核键盘对战</title>
<style>
:root{--bg:#101522;--panel:#1a2335;--panel2:#222e45;--line:#34435f;--text:#edf3ff;--muted:#9eacc5;--a:#61d6c5;--b:#ffbd69;--danger:#ff7185}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#23314b 0,#101522 48%);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:1100px;margin:auto;padding:24px 18px 48px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:clamp(26px,5vw,40px);margin:0;letter-spacing:-1px}.sub{color:var(--muted);margin:4px 0 0}.tag{border:1px solid var(--line);padding:6px 10px;border-radius:99px;color:var(--a);font-size:12px}
.layout{display:grid;grid-template-columns:310px 1fr;gap:16px;margin-top:20px}.panel{background:linear-gradient(160deg,#1d2940,#171f30);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 12px 30px #0003}
h2{font-size:17px;margin:0 0 12px}label{display:block;color:var(--muted);font-size:12px;margin:12px 0 5px}
input,select,button{font:inherit}input,select{width:100%;background:#101827;border:1px solid var(--line);border-radius:10px;padding:11px;color:var(--text);outline:none}
button{border:0;border-radius:10px;padding:10px 13px;cursor:pointer;font-weight:700;background:var(--a);color:#10202a;transition:.15s}button:hover{filter:brightness(1.08);transform:translateY(-1px)}button.secondary{background:#2c3a54;color:var(--text);border:1px solid var(--line)}button.warn{background:#ffd08a;color:#33220c}button:disabled{opacity:.45;cursor:not-allowed;transform:none}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.status{margin-top:12px;padding:10px;border-radius:10px;background:#101827;color:var(--muted);font-size:13px;min-height:42px}.status.good{color:var(--a)}.status.bad{color:var(--danger)}
.roomcode{font:700 24px ui-monospace,monospace;letter-spacing:4px;color:var(--b);word-break:break-all}
.games{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.game{background:#121b2b;border:1px solid var(--line);border-radius:13px;padding:12px;text-align:left;color:var(--text);cursor:pointer}.game strong{display:block;font-size:14px}.game small{color:var(--muted)}.game.active{border-color:var(--a);box-shadow:inset 0 0 0 1px var(--a)}
.game:disabled{opacity:.5;cursor:not-allowed}.arena{min-width:0}.arenahead{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.scores{display:flex;gap:10px;color:var(--muted);font-size:13px}.scores b{color:var(--text)}
canvas{width:100%;aspect-ratio:16/9;display:block;background:#0b1220;border:1px solid #3a4964;border-radius:14px;touch-action:none;}
.help{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:10px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.controls button{background:#2a3852;color:var(--text);border:1px solid var(--line);min-width:48px}
.note{color:var(--muted);font-size:12px;margin-top:12px}.footer{margin-top:16px;color:#8291aa;font-size:12px}
@media(max-width:800px){.layout{grid-template-columns:1fr}.games{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<main>
  <div class="top">
    <div><h1>🎮 课间游戏厅</h1><p class="sub">CLASSROOM ARCADE · 键盘纯享版</p></div>
    <span class="tag">非对称随机迷宫</span>
  </div>
  <div class="layout">
    <aside class="panel">
      <h2>连接房间</h2>
      <label>你的昵称</label><input id="nickname" maxlength="14" value="玩家">
      
      <div style="display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px">
        <button id="solo" class="warn" style="width:100%">💻 单机打电脑 (无需网络)</button>
        <select id="difficulty" style="display:none">
            <option value="easy">🤖 AI难度：简单</option>
            <option value="normal" selected>🤖 AI难度：普通</option>
            <option value="hard">🤖 AI难度：困难</option>
        </select>
      </div>
      
      <div style="text-align:center;color:var(--muted);font-size:12px;margin:10px 0">— 或者 联机对战 —</div>

      <div class="actions">
        <button id="create">创建房间</button>
        <button id="copy" class="secondary" disabled>复制房间码</button>
      </div>
      <label>加入同桌的房间码</label><input id="joincode" placeholder="输入对方的 4 位数字码" maxlength="4">
      <button id="join" class="secondary" style="width:100%;margin-top:8px">加入房间</button>
      <div class="status" id="status">尚未连接。一个人创建房间，另一个人输入房间码加入。</div>
      <label>当前房间码</label><div class="roomcode" id="roomcode">————</div>
      <p class="note">联机使用 PeerJS / WebRTC。首次连接可能需要几秒钟。</p>
      <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
      <h2>选择游戏</h2>
      <div class="games">
        <button class="game active" data-game="tank"><strong>🚜 坦克对战</strong><small>随机迷宫，纯键盘操作</small></button>
        <button class="game" data-game="space"><strong>🚀 太空对战</strong><small>双飞船竞技</small></button>
        <button class="game" data-game="territory"><strong>🗺️ 领土争夺</strong><small>占领据点</small></button>
        <button class="game" data-game="race"><strong>🏁 双人竞速</strong><small>冲向终点</small></button>
      </div>
      <button id="start" class="warn" style="width:100%;margin-top:12px" disabled>开始本局</button>
      <p class="note">只有房主可以切换游戏和开始新一局。单机模式下自动视为房主。</p>
    </aside>
    <section class="panel arena">
      <div class="arenahead">
        <div><h2 id="gametitle">🚜 坦克对战</h2><div class="sub" id="gamestatus">等待开始</div></div>
        <div class="scores"><span>你：<b id="myscore">0</b></span><span>对手：<b id="opscore">0</b></span></div>
      </div>
      <canvas id="game" width="960" height="540"></canvas>
      <div class="help">
        <span>移动：W A S D</span>
        <span>旋转炮管：Q / E</span>
        <span>射击 / 准备：空格</span>
      </div>
      <div class="controls">
        <button data-key="w">W</button><button data-key="a">A</button><button data-key="s">S</button><button data-key="d">D</button>
        <button data-key="q" style="color:var(--b)">Q 左转</button><button data-key="e" style="color:var(--b)">E 右转</button>
        <button data-key=" " style="background:var(--danger)">空格 开火</button>
      </div>
      <div class="footer">提示：地图为随机生成的复杂非对称结构，注意利用掩体。双方在局末按空格可准备重开。</div>
    </section>
  </div>
</main>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(() => {
const $=id=>document.getElementById(id), canvas=$('game'),ctx=canvas.getContext('2d');
const W=960,H=540, colors=['#61d6c5','#ffbd69'];
let peer=null,conn=null,isHost=false,isSinglePlayer=false,connected=false,roomId='',role=0,game='tank',state=null,keys={},lastSend=0,raf=0;
let remoteInput={};
const names={tank:'🚜 坦克对战',space:'🚀 太空对战',territory:'🗺️ 领土争夺',race:'🏁 双人竞速'};

// --- 复杂非对称随机迷宫生成 ---
function generateRandomMaze() {
    while(true) {
        let maze = [
            {x: 0, y: 0, w: 960, h: 20}, {x: 0, y: 520, w: 960, h: 20},
            {x: 0, y: 0, w: 20, h: 540}, {x: 940, y: 0, w: 20, h: 540}
        ];
        let numObstacles = 22 + Math.floor(Math.random() * 8);
        
        for (let i = 0; i < numObstacles; i++) {
            let isHoriz = Math.random() > 0.5;
            let w = isHoriz ? 60 + Math.floor(Math.random() * 160) : 24;
            let h = !isHoriz ? 60 + Math.floor(Math.random() * 160) : 24;
            let x = 30 + Math.floor(Math.random() * (900 - w));
            let y = 30 + Math.floor(Math.random() * (480 - h));
            
            // 避开左右出生点 (玩家在 x:80, y:270 和 x:880, y:270 附近)
            let safeLeft = (x < 160 && y < 350 && y + h > 190);
            let safeRight = (x + w > 800 && y < 350 && y + h > 190);
            // 避开正中心
            let safeCenter = (x < 550 && x + w > 410 && y < 350 && y + h > 190);
            
            if (!safeLeft && !safeRight && !safeCenter) {
                // 简单重叠检测
                let overlap = false;
                for (let m of maze) {
                    if (x < m.x + m.w && x + w > m.x && y < m.y + m.h && y + h > m.y) {
                        overlap = true; break;
                    }
                }
                if (!overlap) maze.push({x, y, w, h});
            }
        }
        
        // 随机散布一些小块障碍物增加不对称和复杂性
        for(let i=0; i<8; i++) {
            let s = 20 + Math.floor(Math.random() * 20);
            let x = 60 + Math.floor(Math.random() * 840);
            let y = 60 + Math.floor(Math.random() * 420);
            let safeLeft = (x < 150 && y < 340 && y + s > 200);
            let safeRight = (x > 810 && y < 340 && y + s > 200);
            if(!safeLeft && !safeRight) maze.push({x, y, w: s, h: s});
        }
        
        // 验证出生点没有卡墙
        let p1Safe = true, p2Safe = true;
        for (let m of maze) {
            // p1 (80, 270)
            let cx1 = Math.max(m.x, Math.min(80, m.x + m.w));
            let cy1 = Math.max(m.y, Math.min(270, m.y + m.h));
            if ((80 - cx1)**2 + (270 - cy1)**2 < 20**2) { p1Safe = false; break; }
            // p2 (880, 270)
            let cx2 = Math.max(m.x, Math.min(880, m.x + m.w));
            let cy2 = Math.max(m.y, Math.min(270, m.y + m.h));
            if ((880 - cx2)**2 + (270 - cy2)**2 < 20**2) { p2Safe = false; break; }
        }
        
        if (p1Safe && p2Safe) return maze;
    }
}

function status(msg,type=''){ $('status').textContent=msg;$('status').className='status '+type; }
function send(data){if(!isSinglePlayer && conn&&conn.open)conn.send(data)}

function makePeer(customId) {
    return new Promise((resolve, reject) => {
        let p = new Peer(customId, { debug: 0 });
        p.on('open', id => { peer = p; resolve(id); });
        p.on('error', err => {
            if (err.type !== 'peer-unavailable') p.destroy(); 
            reject(err);
        });
        p.on('disconnected', () => status('网络连接中断…', 'bad'));
    });
}

function setConnected(){connected=true;$('start').disabled=!isHost;document.querySelectorAll('.game').forEach(b=>b.disabled=!isHost);status('已连接！你们可以开始游戏了。','good');$('gamestatus').textContent='两名玩家已就位';}

function initState(){
  return {
    game,started:true,over:false,winner:-1,score:[0,0],countdown:-1,ready:[false,false],
    players:[
      {x:80,y:270,a:0,hp:3,lap:0,cool:0},
      {x:880,y:270,a:Math.PI,hp:3,lap:0,cool:0}
    ],
    bullets:[],nodes:[{x:300,y:170,owner:-1,hold:0},{x:480,y:270,owner:-1,hold:0},{x:660,y:370,owner:-1,hold:0}],
    obstacles:Array.from({length:9},(_,i)=>({x:260+(i%3)*220,y:140+Math.floor(i/3)*130,r:20})),
    maze: game==='tank' ? generateRandomMaze() : []
  };
}

function hostStart(){if(!isHost||(!connected && !isSinglePlayer))return;state=initState();game=state.game;send({type:'state',state});$('gamestatus').textContent='进行中 · '+names[game];}
function chooseGame(g){if(!isHost)return;game=g;document.querySelectorAll('.game').forEach(b=>b.classList.toggle('active',b.dataset.game===g));$('gametitle').textContent=names[g];if(connected)send({type:'game',game:g});state=null;draw();}
document.querySelectorAll('.game').forEach(b=>b.onclick=()=>chooseGame(b.dataset.game));

$('solo').onclick=()=>{
  isSinglePlayer = true; isHost = true; connected = true; role = 0;
  $('solo').disabled = true; $('solo').textContent = '💻 已进入单机模式';
  $('difficulty').style.display = 'block';
  $('create').disabled = true; $('join').disabled = true;
  $('start').disabled = false;
  document.querySelectorAll('.game').forEach(b=>b.disabled = false);
  $('gamestatus').textContent = '单机模式准备就绪，点击下方开始';
  status('单机模式已启动！选择难度并点击“开始”。', 'good');
  $('roomcode').textContent = 'AI';
};

$('create').onclick=async()=>{
  if(isSinglePlayer) return;
  $('create').disabled=true; status('正在创建房间…');
  isHost=true; role=0;
  let success = false; let retries = 5;
  while(!success && retries > 0) {
      let code = Math.floor(1000 + Math.random() * 9000).toString(); 
      try { roomId = await makePeer(code); success = true; }
      catch (e) {
          if(e.type === 'unavailable-id') { retries--; continue; } 
          status('创建失败：'+e.message,'bad'); $('create').disabled=false; return;
      }
  }
  if(success) {
      $('roomcode').textContent=roomId; $('copy').disabled=false;
      status('房间已创建。把 4 位房间码发给同桌。','good');
      peer.on('connection',c=>{if(conn){c.close();return;}conn=c;wire();});
      $('start').disabled=true;
  } else { status('尝试多次未能创建，请检查网络。', 'bad'); $('create').disabled=false; }
};

$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(roomId);status('房间码已复制。','good')}catch(e){status('复制失败，请手动复制。') }};

$('join').onclick=async()=>{
  if(isSinglePlayer) return;
  const id=$('joincode').value.trim();
  if(!id || id.length !== 4) return status('请输入 4 位数字房间码。','bad');
  try{
      $('join').disabled=true; status('正在连接房间 ' + id + '…');
      isHost=false; role=1;
      await makePeer(undefined);
      conn=peer.connect(id,{reliable:true});
      wire();
  }catch(e){ status('连接失败：'+e.message,'bad'); $('join').disabled=false; }
};

function wire(){
    conn.on('open',()=>{
        setConnected();send({type:'hello',name:$('nickname').value||'玩家'});if(isHost)send({type:'game',game});
    });
    conn.on('data',m=>{
        if(!m)return;
        if(isHost){
            if(m.type==='input') remoteInput=m.input||{};
            if(m.type==='toggle_ready' && state && state.over) { state.ready[1] = !state.ready[1]; send({type:'state',state}); }
        } else {
            if(m.type==='state'){state=m.state;game=state.game;updateGameUI();}
            if(m.type==='game'){
                game=m.game;state=null;
                document.querySelectorAll('.game').forEach(b=>b.classList.toggle('active',b.dataset.game===game));
                $('gametitle').textContent=names[game];draw();
            }
            if(m.type==='hello')$('gamestatus').textContent='已连接对手：'+m.name;
        }
    });
    conn.on('close',()=>{connected=false;status('对方已断开连接。','bad');$('gamestatus').textContent='等待对手重新连接';});
}

// --- 纯键盘输入事件 ---
function keyName(k){return k===' '||k==='Spacebar'?' ':k.toLowerCase();}
window.addEventListener('keydown',e=>{
    const k=keyName(e.key);
    if(['w','a','s','d','q','e','arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
    
    // 如果是游戏结束状态，且按了空格
    if (k === ' ' && state && state.over) {
        if (isHost) {
            state.ready[0] = !state.ready[0];
            send({type:'state', state});
        } else {
            send({type:'toggle_ready'});
        }
        return; // 避免触发开火逻辑
    }
    
    keys[k]=true;
});
window.addEventListener('keyup',e=>{keys[keyName(e.key)]=false;});
window.addEventListener('blur',()=>{keys={};});

document.querySelectorAll('[data-key]').forEach(b=>{
    const k=b.dataset.key;
    const down=e=>{e.preventDefault();keys[k]=true},up=e=>{e.preventDefault();keys[k]=false};
    b.addEventListener('pointerdown',down);
    ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,up));
});

function getInput(){
  let dx = (keys['d']||keys['arrowright']?1:0)-(keys['a']||keys['arrowleft']?1:0);
  let dy = (keys['s']||keys['arrowdown']?1:0)-(keys['w']||keys['arrowup']?1:0);
  if (dx !== 0 || dy !== 0) { const len = Math.hypot(dx, dy); dx /= len; dy /= len; }
  return { 
      dx, dy, 
      rotL: !!keys['q'], 
      rotR: !!keys['e'], 
      fire: !!keys[' '] 
  };
}

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

function checkWallCollision(x, y, radius = 16) {
  if(!state || !state.maze) return false;
  for (let w of state.maze) {
    let closestX = clamp(x, w.x, w.x + w.w);
    let closestY = clamp(y, w.y, w.y + w.h);
    let dx = x - closestX, dy = y - closestY;
    if (dx*dx + dy*dy < radius*radius) return true;
  }
  return false;
}

function hasLineOfSight(x1, y1, x2, y2) {
    if(!state || !state.maze) return true;
    let dist = Math.hypot(x2 - x1, y2 - y1);
    let steps = Math.max(2, Math.floor(dist / 20));
    for (let i = 1; i < steps; i++) {
        let cx = x1 + (x2 - x1) * (i / steps);
        let cy = y1 + (y2 - y1) * (i / steps);
        if (checkWallCollision(cx, cy, 2)) return false;
    }
    return true;
}

function getAiInput(aiP, targetP) {
    let dx = targetP.x - aiP.x;
    let dy = targetP.y - aiP.y;
    let dist = Math.hypot(dx, dy);
    let fire = false;
    let aimAngle = Math.atan2(dy, dx);
    const diff = $('difficulty').value;
    
    let seekX = dx / (dist || 1);
    let seekY = dy / (dist || 1);
    let hasVision = hasLineOfSight(aiP.x, aiP.y, targetP.x, targetP.y);

    let bestDirX = seekX;
    let bestDirY = seekY;
    let bestScore = -Infinity;

    for (let i = 0; i < 16; i++) {
        let angle = (i / 16) * Math.PI * 2;
        let dirX = Math.cos(angle), dirY = Math.sin(angle);
        let score = 0;
        let dot = dirX * seekX + dirY * seekY;
        score += dot * 10;
        
        let lookAhead = 45;
        let checkX = aiP.x + dirX * lookAhead;
        let checkY = aiP.y + dirY * lookAhead;
        let midX = aiP.x + dirX * (lookAhead/2);
        let midY = aiP.y + dirY * (lookAhead/2);
        
        if (checkWallCollision(checkX, checkY, 18) || checkWallCollision(midX, midY, 18)) score -= 100; 

        let dodgeChance = diff === 'hard' ? 1.0 : (diff === 'normal' ? 0.5 : 0);
        if (Math.random() < dodgeChance) {
             for (let b of state.bullets) {
                 if (b.owner !== 1) continue;
                 let bdx = aiP.x - b.x, bdy = aiP.y - b.y;
                 if (Math.hypot(bdx, bdy) < 250) {
                     let vLen = Math.hypot(b.vx, b.vy);
                     let bvx = b.vx / (vLen || 1), bvy = b.vy / (vLen || 1);
                     if (bdx * bvx + bdy * bvy > 0) {
                         if (Math.abs(dirX * bvx + dirY * bvy) < 0.3) score += 40; 
                     }
                 }
             }
        }

        if (hasVision) {
            if (diff === 'hard') {
                if (dist < 200) score -= dot * 15; 
                else if (dist < 350) {
                    let perpX = -seekY, perpY = seekX;
                    score += Math.abs(dirX * perpX + dirY * perpY) * 6;
                }
            }
        }
        if (score > bestScore) { bestScore = score; bestDirX = dirX; bestDirY = dirY; }
    }

    if (hasVision) {
        let fireChance = diff === 'easy' ? 0.015 : (diff === 'normal' ? 0.05 : 0.12);
        if (Math.random() < fireChance) fire = true;
        
        if (diff === 'hard' && (targetP.dx || targetP.dy)) {
             let preX = targetP.x + (targetP.dx || 0) * 35;
             let preY = targetP.y + (targetP.dy || 0) * 35;
             aimAngle = Math.atan2(preY - aiP.y, preX - aiP.x);
        } else {
             let jitter = diff === 'easy' ? 0.6 : (diff === 'normal' ? 0.15 : 0.03);
             aimAngle += (Math.random() - 0.5) * jitter;
        }
    }

    // 将目标角度转换为旋转按键状态
    let rotL = false, rotR = false;
    let angleDiff = aimAngle - aiP.a;
    while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
    while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
    
    if (angleDiff > 0.1) rotR = true;
    else if (angleDiff < -0.1) rotL = true;

    return { dx: bestDirX, dy: bestDirY, rotL, rotR, fire, aimAngle };
}

function update(dt){
 if(!state||!state.started)return;
 
 // 倒计时逻辑
 if (state.over) {
     if (isSinglePlayer) state.ready[1] = true; // 电脑自动准备
     
     if (state.ready[0] && state.ready[1]) {
         if (state.countdown === -1) state.countdown = 3.0;
         else {
             state.countdown -= dt;
             if (state.countdown <= 0 && isHost) hostStart();
         }
     } else {
         state.countdown = -1;
     }
 } else {
     state.countdown = -1;
 }

 let inputs = [null, null];
 if (isSinglePlayer) {
   inputs[0] = getInput();
   inputs[1] = getAiInput(state.players[1], state.players[0]);
 } else if (isHost) {
   inputs[0] = getInput();
   inputs[1] = remoteInput;
 }

 for(let i=0;i<2;i++){
  const p=state.players[i],inp=inputs[i]||{};
  const speed = game==='race'?260:180;
  let moveDx = inp.dx || 0, moveDy = inp.dy || 0;
  p.dx = moveDx; p.dy = moveDy;

  if(moveDx || moveDy){
    let nextX = p.x + moveDx*speed*dt;
    let nextY = p.y + moveDy*speed*dt;
    if (!checkWallCollision(nextX, p.y, 16)) p.x = nextX;
    if (!checkWallCollision(p.x, nextY, 16)) p.y = nextY;
    if (game==='race') p.a=Math.atan2(moveDy,moveDx);
  }
  
  // 纯键盘旋转炮管
  if (game === 'tank') {
    let rotSpeed = 3.5; // 弧度/秒
    if (inp.rotL) p.a -= rotSpeed * dt;
    if (inp.rotR) p.a += rotSpeed * dt;
  }

  p.x=clamp(p.x,28,W-28);p.y=clamp(p.y,35,H-35);

  if(game==='tank'||game==='space'){
   p.cool=(p.cool||0)-dt;
   if(inp.fire && p.cool<=0 && !state.over){
     state.bullets.push({x:p.x+Math.cos(p.a)*28,y:p.y+Math.sin(p.a)*28,vx:Math.cos(p.a)*480,vy:Math.sin(p.a)*480,owner:i,life:1.5});
     p.cool=.4; 
   }
  }
  if(game==='race'){p.lap+=Math.max(0,moveDx)*dt*0.7;if(p.x>W-65&&p.y>190&&p.y<350){p.lap+=dt*2;}if(p.lap>=4){state.over=true;state.winner=i;}}
 }
 
 state.bullets=state.bullets.filter(b=>{
   b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
   if(b.life<=0||b.x<0||b.x>W||b.y<0||b.y>H)return false;
   if(checkWallCollision(b.x, b.y, 5)) return false; 
   
   for(let i=0;i<2;i++){
     if(i!==b.owner){
       const p=state.players[i];
       if(Math.hypot(p.x-b.x,p.y-b.y)<22){
         p.hp--;
         if(p.hp<=0){state.over=true;state.winner=b.owner;state.ready=[false,false];}
         return false;
       }
     }
   }
   return true;
 });

 if(game==='territory'){
   for(const n of state.nodes){
     for(let i=0;i<2;i++){
       const p=state.players[i];
       if(Math.hypot(p.x-n.x,p.y-n.y)<55){n.hold+=dt*(i===0?1:-1);if(n.hold>2){n.owner=0;n.hold=2;}if(n.hold< -2){n.owner=1;n.hold=-2;}}
     }
   }
   state.score=[state.nodes.filter(n=>n.owner===0).length,state.nodes.filter(n=>n.owner===1).length];
   if(state.score[0]>=2||state.score[1]>=2){state.over=true;state.winner=state.score[0]>=2?0:1;}
 }
 if(game==='race'){state.score=state.players.map(p=>Math.floor(p.lap*25));}
}

function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}

function draw(){
 ctx.clearRect(0,0,W,H);ctx.fillStyle='#0b1220';ctx.fillRect(0,0,W,H);
 ctx.strokeStyle='#1c2a40';ctx.lineWidth=1;
 for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
 for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 
 if(!state){
   ctx.fillStyle='#dce8ff';ctx.textAlign='center';ctx.font='bold 30px system-ui';
   ctx.fillText(isSinglePlayer?'单机模式准备就绪':'等待开始',W/2,H/2-8);
   ctx.font='16px system-ui';ctx.fillStyle='#8291aa';
   ctx.fillText(isSinglePlayer?'选择AI难度，点击下方按钮开战':'点击左侧“单机”或联机创建房间',W/2,H/2+25);return;
 }
 
 if(state.maze){
   ctx.fillStyle = '#34435f'; ctx.strokeStyle = '#4a5d7e'; ctx.lineWidth = 2;
   for (let w of state.maze) {
     ctx.fillRect(w.x, w.y, w.w, w.h);
     ctx.strokeRect(w.x, w.y, w.w, w.h);
     ctx.strokeStyle = '#252f42';ctx.beginPath();ctx.moveTo(w.x, w.y+w.h);ctx.lineTo(w.x, w.y);ctx.lineTo(w.x+w.w, w.y);ctx.stroke();
     ctx.strokeStyle = '#4a5d7e';
   }
 }

 if(game==='race'){ctx.fillStyle='#25334b';roundRect(65,105,830,330,26);ctx.strokeStyle='#657995';ctx.lineWidth=5;ctx.strokeRect(90,130,780,280);ctx.strokeStyle='#9eacc5';ctx.setLineDash([18,15]);ctx.lineWidth=3;ctx.strokeRect(105,145,750,250);ctx.setLineDash([]);ctx.fillStyle='#f4f6fb';ctx.fillRect(835,205,12,130);ctx.fillStyle='#ffbd69';ctx.font='bold 16px system-ui';ctx.fillText('终点',840,190);}
 if(game==='territory'){for(const n of state.nodes){ctx.beginPath();ctx.arc(n.x,n.y,35,0,Math.PI*2);ctx.fillStyle=n.owner<0?'#46546b':colors[n.owner];ctx.fill();ctx.strokeStyle='#eaf2ff';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#101522';ctx.textAlign='center';ctx.font='bold 18px system-ui';ctx.fillText('★',n.x,n.y+7);}}
 
 if(game==='tank'||game==='space'){
   for(const b of state.bullets){
     ctx.beginPath();ctx.arc(b.x,b.y,7,0,Math.PI*2);ctx.fillStyle=colors[b.owner];ctx.fill();
     ctx.shadowBlur = 10; ctx.shadowColor = colors[b.owner]; ctx.fill(); ctx.shadowBlur = 0;
   }
 }

 state.players.forEach((p,i)=>{
   ctx.save();ctx.translate(p.x,p.y);
   if(game==='tank'){
     ctx.fillStyle = 'rgba(0,0,0,0.4)';ctx.beginPath();ctx.arc(2,2,16,0,Math.PI*2);ctx.fill();
     ctx.fillStyle=colors[i];ctx.beginPath();ctx.arc(0,0,16,0,Math.PI*2);ctx.fill();
     ctx.fillStyle='#172338';ctx.beginPath();ctx.arc(0,0,10,0,Math.PI*2);ctx.fill();
     ctx.rotate(p.a);
     ctx.fillStyle='#dce8ff';roundRect(0,-5,30,10,3);
     ctx.fillStyle=colors[i];ctx.beginPath();ctx.arc(0,0,14,0,Math.PI*2);ctx.fill();
     ctx.fillStyle='#ff4757';roundRect(26,-4,6,8,2);
   } else if(game==='space'){
     ctx.rotate(p.a);ctx.beginPath();ctx.moveTo(27,0);ctx.lineTo(-19,-16);ctx.lineTo(-11,0);ctx.lineTo(-19,16);ctx.closePath();ctx.fillStyle=colors[i];ctx.fill();
   } else {
     ctx.beginPath();ctx.arc(0,0,19,0,Math.PI*2);ctx.fillStyle=colors[i];ctx.fill();ctx.fillStyle='#10202a';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillText(i===0?'1':'2',0,5);
   }
   ctx.restore();
 });

 ctx.textAlign='left';ctx.font='bold 16px system-ui';
 ctx.fillStyle=colors[0];ctx.fillText('玩家 1  ♥ '+state.players[0].hp,24,30);
 ctx.fillStyle=colors[1];ctx.fillText((isSinglePlayer?'电脑':'玩家 2')+'  ♥ '+state.players[1].hp,W-170,30);
 
 if(state.over){
   ctx.fillStyle='#08101dcc';ctx.fillRect(0,0,W,H);
   ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 38px system-ui';
   ctx.fillText(state.winner<0?'本局结束':`${state.winner===0?'你':(isSinglePlayer?'电脑':'玩家 2')} 获胜！`,W/2,H/2-40);
   
   // 准备与倒计时界面
   let readyCount = (state.ready[0]?1:0) + (state.ready[1]?1:0);
   ctx.font='bold 22px system-ui';ctx.fillStyle='#c0cbe0';
   ctx.fillText(`准备重开: ${readyCount} / 2`, W/2, H/2 + 15);
   
   if (state.countdown > 0) {
       ctx.font='bold 50px system-ui';ctx.fillStyle='var(--b)';
       ctx.fillText(Math.ceil(state.countdown), W/2, H/2 + 85);
   } else {
       ctx.font='16px system-ui';ctx.fillStyle='#8291aa';
       ctx.fillText('按空格键确认准备 (两人均准备后自动重开)',W/2,H/2+55);
   }
 }
}

function updateGameUI(){
    if(!state)return;
    $('myscore').textContent=state.score[role]??0;
    $('opscore').textContent=state.score[1-role]??0;
    
    let stext = state.over ? `本局结束 · ${state.winner===role?'你赢了！':state.winner===1-role?'对手获胜':'平局'}` : '进行中 · '+names[game];
    if(state.over && state.countdown > 0) stext += ` · 重开倒计时 ${Math.ceil(state.countdown)}s`;
    $('gamestatus').textContent=stext;
}

let last=performance.now();
function loop(now){
 const dt=Math.min(.04,(now-last)/1000);last=now;
 if(isHost && (connected || isSinglePlayer)){
   update(dt);
   if(!isSinglePlayer && now-lastSend>45){send({type:'state',state});lastSend=now;}
 }
 if(!isHost && connected && now-lastSend>45){send({type:'input',input:getInput()});lastSend=now;}
 if(isHost&&state)updateGameUI();
 draw();
 raf=requestAnimationFrame(loop);
}

$('start').onclick=hostStart;
$('gametitle').textContent=names[game];
draw();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
